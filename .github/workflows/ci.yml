name: QA - Three.js + Rapier + WebKit iPhone
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-build:
    name: Typecheck, unit tests & bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: gamecrash-dist
          path: dist/
          retention-days: 14
  browser-e2e:
    name: Playwright - Chromium Desktop + WebKit iPhone 13
    runs-on: ubuntu-latest
    needs: unit-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gamecrash-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  publish-pages:
    name: Publish compiled GameCrash to GitHub Pages
    needs: [unit-and-build, browser-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gamecrash-pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: gamecrash-dist
          path: dist
      - name: Publish QA-approved compiled build via GitHub Pages branch source
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -name '*.js' -print -quit)"
          test -n "$(find dist/assets -maxdepth 1 -name '*.css' -print -quit)"
          rm -rf play
          mkdir -p play
          cp -a dist/. play/
          touch .nojekyll
          git add -f -A play/ .nojekyll
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: update playable GitHub Pages artifact'
            git push origin HEAD:main
          else
            echo 'GitHub Pages build already up to date.'
          fi
      - name: Verify public GitHub Pages game and required JS/CSS
        env:
          PAGE_URL: https://nutricionistaalmeidavh-spec.github.io/GameCrash/play/
        run: node scripts/check-pages.mjs
      - name: Verify root GameCrash URL redirects to game
        run: node scripts/check-pages-root.mjs
