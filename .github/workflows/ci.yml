name: QA - Three.js + Rapier + WebKit iPhone
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-build:
    name: Typecheck, unit tests & bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: gamecrash-dist
          path: dist/
          retention-days: 14
  browser-e2e:
    name: Playwright - Chromium Desktop + WebKit iPhone 13
    runs-on: ubuntu-latest
    needs: unit-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gamecrash-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
