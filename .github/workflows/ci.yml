name: QA - Three.js + Rapier + WebKit iPhone
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-build:
    name: Typecheck, unit tests & bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: gamecrash-dist
          path: dist/
          retention-days: 14
  browser-e2e:
    name: Playwright - Chromium Desktop + WebKit iPhone 13
    runs-on: ubuntu-latest
    needs: unit-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gamecrash-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy-pages:
    name: Publish GitHub Pages after QA
    needs: [unit-and-build, browser-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gamecrash-dist
          path: dist
      - name: Attempt to switch Pages source to Actions (requires admin permission)
        continue-on-error: true # Legacy branch source may require a one-time manual Pages setting
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/pages-source.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test live Pages HTML and compiled JS/CSS
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/check-pages.mjs
