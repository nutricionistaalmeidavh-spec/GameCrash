name: Publish playable GameCrash on branch Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'play/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gamecrash-compiled-legacy-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish static /play/ (no Pages settings required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Copy Vite production build into the published branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf play
          mkdir -p play
          cp -a dist/. play/
          touch .nojekyll
          test -f play/index.html
          test -n "$(find play/assets -maxdepth 1 -name '*.js' -print -quit)"
          test -n "$(find play/assets -maxdepth 1 -name '*.css' -print -quit)"
          git add -f -A play/ .nojekyll
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: publish compiled playable GameCrash for branch Pages'
            git push origin HEAD:main
          fi
      - name: Verify deployed HTML and compiled assets
        env:
          PAGE_URL: https://nutricionistaalmeidavh-spec.github.io/GameCrash/play/
        run: node scripts/check-pages.mjs
