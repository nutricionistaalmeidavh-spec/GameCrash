name: Build Brazil Crash 3D Assets

on:
  push:
    branches:
      - feat/brasil-mapas-carros
    paths:
      - "tools/brasil/**"
      - "tests/test_brazil_assets.py"
      - ".github/workflows/build-brazil-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free open-source dependencies
        run: python -m pip install --disable-pip-version-check numpy trimesh pytest
      - name: Generate all GLB meshes and catalog
        run: python -m tools.brasil.build
      - name: Verify all generated assets
        run: python -m pytest -q tests/test_brazil_assets.py
      - name: Commit models only to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/brazil/ src/brazil/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "assets: generate 10 Brazilian cars and 3 maps [skip ci]"
            git push
          fi
