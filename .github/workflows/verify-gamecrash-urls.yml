name: Verify externally playable GameCrash URLs
on:
  push:
    branches: ['fix/gamecrash-public-cdn-fallback']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check static hosts, HTML, JS, CSS, and 3D assets
        env:
          REVISION: d119c750a98771caaf09a43c29c85300d77bfeb4
        run: |
          node --input-type=module <<'NODE'
          const owner='nutricionistaalmeidavh-spec/GameCrash';
          const rev=process.env.REVISION;
          const urls=[
            'https://nutricionistaalmeidavh-spec.github.io/GameCrash/play/',
            `https://raw.githack.com/${owner}/${rev}/play/index.html`,
            `https://rawcdn.githack.com/${owner}/${rev}/play/index.html`,
            `https://cdn.jsdelivr.net/gh/${owner}@${rev}/play/index.html`,
          ];
          let passed=0;
          for (const url of urls) {
            try {
              const res=await fetch(url,{signal:AbortSignal.timeout(15000)});
              const html=await res.text();
              if(!res.ok)throw Error(`HTML status ${res.status}`);
              const js=html.match(/<script[^>]+src="([^"]+\.js)"/i)?.[1];
              const css=html.match(/<link[^>]+href="([^"]+\.css)"/i)?.[1];
              if(!js||!css||html.includes('src="/src/main.ts"'))throw Error('HTML is not compiled');
              const assets=[js,css,'./assets/concept/car.glb'];
              for(const path of assets) {
                const full=new URL(path,url);
                const file=await fetch(full,{signal:AbortSignal.timeout(25000)});
                if(!file.ok)throw Error(`Asset ${full} HTTP ${file.status}`);
                const type=file.headers.get('content-type')??'';
                if(path.endsWith('.js')&&!/javascript|ecmascript/.test(type))throw Error(`JS invalid MIME ${type}`);
                if(path.endsWith('.css')&&!/css/.test(type))throw Error(`CSS invalid MIME ${type}`);
                if(path.endsWith('.glb')&&!Number(file.headers.get('content-length')??1))throw Error('empty GLB');
                await file.body?.cancel();
              }
              console.log('PASS: '+url);
              passed++;
            } catch(error) {console.error('FAIL: '+url+' '+String(error))}
          }
          if(!passed)process.exitCode=1;
          NODE
