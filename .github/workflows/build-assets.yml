name: Build Brazilian assets
on:
  push:
    branches: [feat/mapas-carros-brasil-v1]
    paths:
      - 'tools/generate-assets.py'
      - 'tests/test_assets.py'
      - '.github/workflows/build-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free open-source dependencies
        run: pip install "numpy>=1.26,<3" "trimesh>=4,<5" "pytest>=8,<10"
      - name: Generate actual GLB cars, maps and manifest
        run: python tools/generate-assets.py
      - name: Test every generated 3D model
        run: python -m pytest tests/test_assets.py -q
      - name: Commit generated models to the same feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets
          if ! git diff --cached --quiet; then
            git commit -m "assets: add ten Brazilian cars and three 3D maps"
            git push
          fi
